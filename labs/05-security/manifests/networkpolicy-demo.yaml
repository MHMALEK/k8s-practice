apiVersion: v1
kind: Pod
metadata:
  name: lab05-api
  labels:
    app: lab05-api
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab05-api
spec:
  selector:
    app: lab05-api
  ports:
    - port: 80
      targetPort: 80
---
# Once applied: only Pods with access=granted can reach lab05-api on port 80
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab05-api-allow-granted
spec:
  podSelector:
    matchLabels:
      app: lab05-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: granted
      ports:
        - protocol: TCP
          port: 80
