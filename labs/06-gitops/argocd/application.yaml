apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab06-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MHMALEK/k8s-practice.git
    targetRevision: main
    path: labs/06-gitops/apps/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: lab06
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
