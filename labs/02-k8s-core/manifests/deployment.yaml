apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab02-web
  labels:
    app: lab02-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lab02-web
  template:
    metadata:
      labels:
        app: lab02-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
