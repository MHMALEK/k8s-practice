apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab04-web
  annotations:
    # Use the nginx IngressClass installed with the controller
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab02-web
                port:
                  number: 80
