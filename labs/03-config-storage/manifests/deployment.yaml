apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab03-web
  labels:
    app: lab03-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab03-web
  template:
    metadata:
      labels:
        app: lab03-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          # Load ALL keys from the ConfigMap as environment variables
          envFrom:
            - configMapRef:
                name: lab03-web-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

